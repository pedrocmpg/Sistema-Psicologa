# Exemplo de Evolution API (v2) para o envio automático de WhatsApp.
# Rode num servidor/VPS com HTTPS na frente (Caddy, Nginx, Traefik...) — a Edge Function
# do Supabase precisa alcançar esta URL pela internet.
#
#   cp .env.example .env   # e preencha
#   docker compose up -d
#
# Fixe a versão da imagem (troque "latest" pela tag testada) para uma atualização não
# quebrar o envio sem você perceber. Veja https://doc.evolution-api.com

services:
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${SERVER_URL}
      # Chave global da API: é o EVOLUTION_API_KEY dos secrets do Supabase.
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      # O sistema só envia: não guardamos conversas nem contatos.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

volumes:
  evolution_instances:
  evolution_pg:
